apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- facts.yaml
replacements:
- source: {kind: ConfigMap, name: cluster-facts, fieldPath: data.domain}
  targets:
  - select: {kind: Route}
    fieldPaths: [spec.host]
    options: {delimiter: ".", index: 1}
- source: {kind: ConfigMap, name: cluster-facts, fieldPath: data.name}
  targets:
  - select: {kind: Deployment}
    fieldPaths:
    - spec.template.spec.containers.*.env.[name=CLUSTER_NAME].value
