apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - clusters:
          selector:
            matchLabels:
              gitops.example.com/local: "true"
      - git:
          repoURL: https://git.example.com/platform/gitops.git
          revision: 'wave-{{.metadata.labels.wave}}'
          files:
          - path: 'apps/*/clusters/{{.name}}/argocd.json'
  template:
    metadata:
      name: '{{.app}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.sync.wave}}'
    spec:
      project: default
      source:
        repoURL: https://git.example.com/platform/gitops.git
        targetRevision: 'wave-{{.metadata.labels.wave}}'
        path: '{{.path.path}}'
      destination:
        server: '{{ .server }}'

  # templatePatch so the values render as booleans, not strings. `dig` falls back to true
  # only when a key is missing; unlike `default`, it keeps an explicit false.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          enabled: {{ dig "sync" "automated" "enabled" true . }}
          prune: {{ dig "sync" "automated" "prune" true . }}
          selfHeal: {{ dig "sync" "automated" "selfHeal" true . }}
