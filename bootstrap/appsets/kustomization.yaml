# Base for every cluster's ApplicationSets. Never applied directly: clusters/<cluster>/argocd/
# builds it with the cluster's revisions.env merged in and bootstrap/revisions applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cluster-config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    config.kubernetes.io/local-config: "true"   # used by replacements, never emitted
configMapGenerator:
- name: appset-revisions
  envs:
  - revisions.env
