# Tenant config: one Application per tenant directory tenants/<tenant>/clusters/<cluster>/, named
# tenant-<tenant> (path segment 1). Every tenant gets the same Argo CD settings, set below: wave
# 30, automated sync, and no pruning, so removing a resource from git never deletes a tenant's
# namespace (and everything in it) automatically.
#
# REVISION and CLUSTER are placeholders, filled in by bootstrap/revisions from the cluster's
# appset-revisions ConfigMap (key tenant-config) and cluster-facts. Pinned and promoted
# separately from cluster-config: scripts/promote <cluster> <ref> --appset tenant-config.
# tenants/ stands in for a separate tenants repo; point repoURL there if it moves out.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://git.example.com/platform/gitops.git
      revision: REVISION
      directories:
      - path: tenants/*/clusters/CLUSTER
  template:
    metadata:
      name: 'tenant-{{index .path.segments 1}}'
      annotations:
        argocd.argoproj.io/sync-wave: "30"
    spec:
      project: default
      source:
        repoURL: https://git.example.com/platform/gitops.git
        targetRevision: REVISION
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          enabled: true
          prune: false
          selfHeal: true
