# The cluster's apps: one Application per apps/<app>/clusters/<cluster>/argocd.yaml. Each is a
# symlink to apps/<app>/argocd.yaml (the app's sync settings); the Application is named after
# <app>, path segment 1.
#
# REVISION and CLUSTER are placeholders, filled in by bootstrap/revisions from the cluster's
# appset-revisions ConfigMap and cluster-facts. The same revision is used for the git generator
# (which apps exist, their sync settings) and for targetRevision (their manifests), so
# everything a cluster runs comes from one commit. See docs/revision-pinning.md.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://git.example.com/platform/gitops.git
      revision: REVISION
      files:
      - path: apps/*/clusters/CLUSTER/argocd.yaml
  template:
    metadata:
      name: '{{index .path.segments 1}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.sync.wave}}'
    spec:
      project: default
      source:
        repoURL: https://git.example.com/platform/gitops.git
        targetRevision: REVISION
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc

  # templatePatch so the values render as booleans, not strings. `dig` falls back to true
  # only when a key is missing; unlike `default`, it keeps an explicit false.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          enabled: {{ dig "sync" "automated" "enabled" true . }}
          prune: {{ dig "sync" "automated" "prune" true . }}
          selfHeal: {{ dig "sync" "automated" "selfHeal" true . }}
