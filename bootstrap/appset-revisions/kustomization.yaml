# Default revision for every ApplicationSet (all main). Included by every base, so the
# bootstrap/revisions Component always has a value for each key. It's local-config and never
# applied, so defaults for ApplicationSets a base doesn't include are harmless.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    config.kubernetes.io/local-config: "true"   # used by replacements, never emitted
configMapGenerator:
- name: appset-revisions
  envs:
  - revisions.env
