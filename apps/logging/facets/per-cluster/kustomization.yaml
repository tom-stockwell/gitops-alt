# The app's replacements from the cluster's facts (clusters/<cluster>/facts). Included in
# every cluster overlay for this app; never selects the app for a cluster.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
- source: {kind: ConfigMap, name: cluster-facts, fieldPath: data.domain}
  targets:
  - select: {kind: Route, name: logging}
    fieldPaths: [spec.host]
    options: {delimiter: ".", index: 2}   # <name>.apps.CLUSTER_DOMAIN
- source: {kind: ConfigMap, name: cluster-facts, fieldPath: data.name}
  targets:
  - select: {kind: Deployment, name: logging}
    fieldPaths:
    - spec.template.spec.containers.[name=logging].env.[name=CLUSTER_NAME].value
